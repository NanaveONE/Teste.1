name: Compilar APK Android (debug)
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Instalar workload Android MAUI
        run: dotnet workload install maui-android
      - name: Publicar APK Debug
        run: dotnet publish XboxImageExtractorMobile.csproj -f net8.0-android -c Debug -p:AndroidPackageFormat=apk
      - uses: actions/upload-artifact@v4
        with:
          name: XboxImageExtractorMobile-debug-apk
          path: '**/bin/Debug/net8.0-android/**/*.apk'
          if-no-files-found: error
