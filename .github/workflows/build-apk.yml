name: Compilar APK Android (debug)

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Instalar workload Android MAUI
        run: dotnet workload install maui-android

      - name: Restaurar projeto
        run: dotnet restore XboxImageExtractorMobile.csproj

      - name: Compilar APK Debug
        run: dotnet publish XboxImageExtractorMobile.csproj -f net10.0-android -c Debug -p:AndroidPackageFormat=apk

      - name: Salvar APK gerado
        uses: actions/upload-artifact@v4
        with:
          name: XboxImageExtractorMobile-debug-apk
          path: '**/bin/Debug/net10.0-android/**/*.apk'
          if-no-files-found: error
